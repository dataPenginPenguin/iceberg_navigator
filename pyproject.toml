[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iceberg-navigator"
version = "0.2.0"
description = "A CLI tool to inspect and diagnose Apache Iceberg snapshot histories on AWS"
requires-python = ">=3.8"
dependencies = [
    "pyiceberg[glue,s3fs]",
    "click",
    "tabulate",
    "networkx",
    "matplotlib",
    "boto3",
]

[project.scripts]
iceberg-navigator = "iceberg_navigator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["iceberg_navigator*"]
